name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            git \
            libbz2-dev \
            libffi-dev \
            libltdl-dev \
            liblzma-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            libtool \
            libtinfo6 \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.5.0 \
            Cython==0.29.36 \
            virtualenv

          buildozer --version
          python --version
          java -version

            - name: Check required files
        run: |
          echo "Project files:"
          ls -la

          echo ""
          echo "Checking buildozer.spec:"
          test -f buildozer.spec

          echo ""
          echo "Checking main.py:"
          test -f main.py


      - name: Clean old Android build cache
        run: |
          rm -rf .buildozer
          rm -rf bin
          rm -f buildozer-full.log

      # continue-on-error важливий:
      # навіть якщо збірка впаде, наступний крок завантажить повний лог.
      - name: Build APK and save full log
        id: apk_build
        continue-on-error: true
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee buildozer-full.log

          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          echo "build_exit_code=${BUILD_EXIT_CODE}" >> "$GITHUB_OUTPUT"

          exit "${BUILD_EXIT_CODE}"

      - name: Show probable error lines
        if: always()
        run: |
          echo "========== POSSIBLE ERRORS =========="

          if [ -f buildozer-full.log ]; then
            grep -n -i -E \
              "error:|error |exception|traceback|failed|failure|command failed|compile failed|not found" \
              buildozer-full.log \
              | tail -n 100 || true
          else
            echo "buildozer-full.log was not created."
          fi

          echo "====================================="

      - name: List APK files
        if: always()
        run: |
          echo "========== APK FILES =========="
          find bin -type f -name "*.apk" -print 2>/dev/null || true
          echo "==============================="

      # Цей artifact з'явиться і при помилці.
      - name: Upload full Buildozer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Buildozer-Full-Log
          path: |
            buildozer-full.log
            .buildozer/**/*.log
          if-no-files-found: warn
          retention-days: 14

      # APK завантажиться лише якщо він справді створений.
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ElectroCalculator-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # Робить workflow червоним, якщо buildozer впав,
      # але лише ПІСЛЯ завантаження повного логу.
      - name: Mark build as failed when APK was not built
        if: always()
        run: |
          if [ "${{ steps.apk_build.outputs.build_exit_code }}" != "0" ]; then
            echo "APK build failed. Download artifact: Buildozer-Full-Log"
            exit 1
          fi
